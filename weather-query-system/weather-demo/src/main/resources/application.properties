spring.application.name=weather-demo
server.port=8081

# 高德API
weather.api.key=${WEATHER_API_KEY}
weather.api.url=https://restapi.amap.com/v3/weather/weatherInfo

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=weather_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.thymeleaf.cache=false