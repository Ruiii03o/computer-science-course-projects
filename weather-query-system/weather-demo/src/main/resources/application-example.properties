spring.application.name=weather-demo
server.port=8081

weather.api.key=YOUR_AMAP_API_KEY
weather.api.url=https://restapi.amap.com/v3/weather/weatherInfo

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=weather_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=YOUR_DATABASE_USERNAME
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.thymeleaf.cache=false