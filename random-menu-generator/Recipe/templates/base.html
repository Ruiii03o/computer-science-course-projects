<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}盲盒食谱{% endblock %}</title>
    <!-- 引用静态CSS文件 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
     <!-- 优化后的头部区域（包含logo banner和导航） -->
    <header class="site-header">
        <!-- 全屏banner图 -->
        <div class="banner-container">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="网站banner图" class="full-width-banner">
            <div class="banner-overlay">
                <h1>盲盒食谱</h1>
            </div>
        </div>

        <!-- 导航栏容器 -->
        <div class="nav-container">
            <nav>
                <a href="/">首页</a>
                <a href="/random">随机抽取</a>
                <a href="/filter">食材筛选</a>
                <a href="/generate">食谱生成</a>
                <a href="/about">关于我们</a>
                <a href="/contact">联系我们</a>
            </nav>
        </div>
    </header>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <footer style="text-align: center;">
        <p>&copy; 2025 盲盒食谱 </p>
    </footer>
</body>
</html>
