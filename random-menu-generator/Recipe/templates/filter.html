{% extends "base.html" %}

{% block title %}食材筛选 - 盲盒食谱{% endblock %}

{% block content %}
<div class="filter-page">
    <h2 class="page-title">按食材和器械筛选菜谱</h2>

    <div class="filter-container">
        <!-- 筛选选项区域 -->
        <div class="filter-options">
            <!-- 食材选择 -->
            <div class="filter-group">
                <h3>选择食材</h3>
                <div class="checkbox-group" id="ingredients">
                    <label><input type="checkbox" value="鸡肉"> 鸡肉</label>
                    <label><input type="checkbox" value="牛肉"> 牛肉</label>
                    <label><input type="checkbox" value="猪肉"> 猪肉</label>
                    <label><input type="checkbox" value="鱼"> 鱼</label>
                    <label><input type="checkbox" value="虾"> 虾</label>
                    <label><input type="checkbox" value="青菜"> 青菜</label>
                    <label><input type="checkbox" value="番茄"> 番茄</label>
                    <label><input type="checkbox" value="土豆"> 土豆</label>
                    <label><input type="checkbox" value="鸡蛋"> 鸡蛋</label>
                    <label><input type="checkbox" value="豆腐"> 豆腐</label>
                </div>
            </div>

            <!-- 器械选择 -->
            <div class="filter-group">
                <h3>选择烹饪器械</h3>
                <div class="checkbox-group" id="equipment">
                    <label><input type="checkbox" value="炒锅"> 炒锅</label>
                    <label><input type="checkbox" value="烤箱"> 烤箱</label>
                    <label><input type="checkbox" value="微波炉"> 微波炉</label>
                    <label><input type="checkbox" value="高压锅"> 高压锅</label>
                    <label><input type="checkbox" value="电饭煲"> 电饭煲</label>
                    <label><input type="checkbox" value="空气炸锅"> 空气炸锅</label>
                </div>
            </div>

            <!-- 筛选按钮 -->
            <button id="filterBtn" class="filter-btn">筛选菜谱</button>
            <button id="resetBtn" class="reset-btn">重置选择</button>
        </div>

        <!-- 筛选结果区域 -->
        <div class="filter-results">
            <h3>符合条件的菜谱 <span id="resultCount">(0)</span></h3>
            <div id="recipesList" class="recipes-grid">
                <!-- 菜谱结果将通过JS动态生成 -->
                <p class="no-results">请选择食材和器械进行筛选</p>
            </div>
        </div>
    </div>
</div>

<script>
    // 假设从后端获取的所有菜谱数据（实际项目中通过API获取）
    const allRecipes = {{ all_recipes|tojson }};

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
        // 筛选按钮事件
        document.getElementById('filterBtn').addEventListener('click', filterRecipes);
        // 重置按钮事件
        document.getElementById('resetBtn').addEventListener('click', resetFilters);
    });

    // 筛选菜谱
    function filterRecipes() {
        // 获取选中的食材
        const selectedIngredients = Array.from(
            document.querySelectorAll('#ingredients input:checked')
        ).map(checkbox => checkbox.value);

        // 获取选中的器械
        const selectedEquipment = Array.from(
            document.querySelectorAll('#equipment input:checked')
        ).map(checkbox => checkbox.value);

        // 筛选逻辑
        let filteredRecipes = allRecipes.filter(recipe => {
            // 检查食材是否匹配（至少包含一种选中的食材）
            const ingredientMatch = selectedIngredients.length === 0 ||
                selectedIngredients.some(ing => recipe.ingredients.includes(ing));

            // 检查器械是否匹配（至少包含一种选中的器械）
            const equipmentMatch = selectedEquipment.length === 0 ||
                selectedEquipment.some(equip => recipe.equipment.includes(equip));

            return ingredientMatch && equipmentMatch;
        });

        // 显示筛选结果
        displayResults(filteredRecipes);
    }

    // 显示筛选结果
    function displayResults(recipes) {
        const resultsContainer = document.getElementById('recipesList');
        const resultCount = document.getElementById('resultCount');

        // 更新结果计数
        resultCount.textContent = `(${recipes.length})`;

        // 清空容器
        resultsContainer.innerHTML = '';

        // 没有结果的情况
        if (recipes.length === 0) {
            resultsContainer.innerHTML = '<p class="no-results">没有找到符合条件的菜谱</p>';
            return;
        }

        // 生成菜谱卡片
        recipes.forEach(recipe => {
            const recipeCard = document.createElement('div');
            recipeCard.className = 'recipe-card';
            recipeCard.innerHTML = `
                <img src="{{ url_for('static', filename='') }}${recipe.image}" alt="${recipe.name}">
                <h4>${recipe.name}</h4>
                <div class="recipe-meta">
                    <span>食材: ${recipe.ingredients.slice(0, 3).join(', ')}</span>
                    <span>器械: ${recipe.equipment.join(', ')}</span>
                </div>
                <a href="/recipe/${recipe.id}" class="view-recipe">查看详情</a>
            `;
            resultsContainer.appendChild(recipeCard);
        });
    }

    // 重置筛选条件
    function resetFilters() {
        // 清空所有选中状态
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.checked = false;
        });

        // 重置结果显示
        document.getElementById('recipesList').innerHTML =
            '<p class="no-results">请选择食材和器械进行筛选</p>';
        document.getElementById('resultCount').textContent = '(0)';
    }
</script>
{% endblock %}
